# Development overrides — merged ON TOP of docker-compose.yml
services:
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src:ro
    command: npm run dev
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend/src:/app/src:ro
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    command: npm run dev -- --host 0.0.0.0

  db:
    ports:
      - "5432:5432"